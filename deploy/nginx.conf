# /etc/nginx/sites-available/tanumanasa.com
# Reverse proxy in front of the Node app on port 3000. Get certificates with: sudo certbot --nginx -d tanumanasa.com -d www.tanumanasa.com

server {
  listen 80;
  server_name tanumanasa.com www.tanumanasa.com;
  return 301 https://www.tanumanasa.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name tanumanasa.com;
  ssl_certificate     /etc/letsencrypt/live/tanumanasa.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tanumanasa.com/privkey.pem;
  return 301 https://www.tanumanasa.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.tanumanasa.com;
  ssl_certificate     /etc/letsencrypt/live/tanumanasa.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tanumanasa.com/privkey.pem;

  client_max_body_size 1m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
